image:
  repository: ghcr.io/proyectoascender/smart-city/smart-city-compss
  pullPolicy: Always
  tag: 1.2-3.3
  # tag: latest-LisDevelop # ✅ This is the actual existing tag

mqtt:
  enabled: false
  image:
    repository: oriolmac/mqtt-broker
    tag: latest
    pullPolicy: Always
  port: 1883
  nodePort: 31883

# template

compss:
  # namespace: {}
  master:
    labels:
      node: master
    ports:
      name: ssh
    # local volume in node where the master is executed
    volume:
      node: agx2
    prometheusClient: 
      enabled: false
      buckets: "-inf, 0.0001, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.1, 1, 10, 50, 100, 200, inf" # Histogram bucket
      containerPort: 15000
      redisContainerPort: 6379

    scheduler_config:
      vertical_scalability: "true"
      vertical_increasing_cpus: 2 # (integer)
    #  vertical_scaling_up_taskThreshold: "115" # ~ 2 min 45s

  worker:
    number: 2
    labels:
      node: worker
    resources:
      cpu: 2
      memory: 2  # in gigabytes
    ports:
      name: ssh
    prometheusClient: 
      enabled: false
      buckets: "-inf, 0.0001, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.1, 1, 10, 50, 100, 200, inf" # Histogram bucket
      containerPort: 15000
      redisContainerPort: 6379

  service:
    ssh: 22

app:
  context:
    folderPath: /root/smart-city-compss
    file: src/main.py
  params:
    mode: "udp"
    edge_ips : "192.168.89.254:8883"
    exp_dir : "/root/smart-city-compss/runs/exp"
    save_results: "True"
    only_results: "False"
    get_speed: "True" 
    get_semantic: "True"


  


# Environment variables for Kafka configuration
# These are read by get_kafka_config_from_env() in udp_handler.py
# Non-sensitive runtime config (ok to keep here or move to a ConfigMap)
environment:
  USE_KAFKA: "true" # Si se prefiere guardar en TXT o kafka
  # Basic Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "ascender-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "smartcity-tracking-topic"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"   # or SASL_SSL/SSL/PLAINTEXT
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  
  # Performance Settings
  KAFKA_FLUSH_INTERVAL: "100"
  KAFKA_AUTO_FLUSH: "true"
  
  # Schema Registry Configuration
  USE_SCHEMA_REGISTRY: "true"
  SCHEMA_REGISTRY_AVAILABLE: "true"
  SCHEMA_REGISTRY_URL: "http://schema-registry.kafka.svc.cluster.local:8081"
  # AVRO_SCHEMA_SUBJECT: "smartcity-tracking-schema"
  AVRO_SCHEMA_SUBJECT: "smartcity-tracking-topic-value"


  

# Tell the chart which existing Secrets to use for creds
credentials:
  kafka:
    secretName: kafka-scram-user        # <-- pre-created Secret
    usernameKey: username
    passwordKey: password
  schemaRegistry:
    enabled: false                      # true if SR needs basic auth
    secretName: schema-registry-cred
    usernameKey: username
    passwordKey: password


monitoring:
  enabled: true
  port: 15000
  prometheusUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  image:
    repository: oriolmac/monitoring-api
    tag: latest-arm
    pullPolicy: Always
  servicemonitor:
    releaseName: prometheus
  namespace: monitoring
  node:




# Default values for compss-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: oriolmac/compss-debug
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: test

mqtt:
  enabled: false
  image:
    repository: eclipse-mosquitto
    tag: latest
    pullPolicy: IfNotPresent
  port: 1883
  nodePort: 31883

monitoring:
  enabled: false
  port: 15000
  redis:
    port: 6379
  prometheusUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  image:
    repository: oriolmac/compss-monitoring
    tag: "1.0"
    pullPolicy: Always
  servicemonitor:
    releaseName: prometheus
  namespace: monitoring
  node:

compss:
  # namespace: {}
  master:
    labels:
      node: master
    ports:
      name: ssh
    # local volume in node where the master is executed
    volume:
      localPath: /home/omartinez/results-helm  # it has to exist locally
      node: agx13

  worker:
    number: 1
    labels:
      node: worker
    resources:
      cpu: 4
      memory: 2  # in gigabytes
    ports:
      name: ssh

  service:
    ssh: 22

app:
  context:
    folderPath: /home/omartinez/compss-matmul/matmul-extract
    file: matmul.py
  params:
    num_blocks: "3"
    elems_per_block: "1024"
    number_iterations: "1"

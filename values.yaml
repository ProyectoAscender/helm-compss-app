# Default values for compss-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#oriolmac/compss-test:latest
#registry.gitlab.bsc.es/ppc/benchmarks/smart-city/smart-city-compss:1.0-3.3-final2-arm
#HOLAMUNDO
image:
  repository: ghcr.io/proyectoascender/smart-city/smart-city-compss
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # tag: 1.1-3.3-arm-final
  tag: latest-LisDevelop

mqtt:
  enabled: false
  image:
    repository: oriolmac/mqtt-broker
    tag: latest
    pullPolicy: Always
  port: 1883
  nodePort: 31883

# template

compss:
  # namespace: {}
  master:
    labels:
      node: master
    ports:
      name: ssh
    # local volume in node where the master is executed
    volume:
      node: agx2
    prometheusClient: 
      enabled: false
      buckets: "-inf, 0.0001, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.1, 1, 10, 50, 100, 200, inf" # Histogram bucket
      containerPort: 15000
      redisContainerPort: 6379

    scheduler_config:
      vertical_scalability: "true"
      vertical_increasing_cpus: 2 # (integer)
    #  vertical_scaling_up_taskThreshold: "115" # ~ 2 min 45s

  worker:
    number: 2
    labels:
      node: worker
    resources:
      cpu: 2
      memory: 2  # in gigabytes
    ports:
      name: ssh
    prometheusClient: 
      enabled: false
      buckets: "-inf, 0.0001, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.1, 1, 10, 50, 100, 200, inf" # Histogram bucket
      containerPort: 15000
      redisContainerPort: 6379

  service:
    ssh: 22

#Estos parametros son los mismos que en el archivo run.sh de smart-city-compss

app:
  context:
    folderPath: /root/smart-city-compss
    file: src/main.py
  params:
    mode: "udp"
    edge_ips : "192.168.89.254:8883"
    exp_dir : "/root/smart-city-compss/runs/exp"
    save_results: "True"
    only_results: "False"
    get_speed: "True" 
    get_semantic: "True"
    save_plot: "False"


# Environment variables for Kafka configuration
# These are read by get_kafka_config_from_env() in udp_handler.py
environment:
  # Kafka broker configuration
  KAFKA_BOOTSTRAP_SERVERS: "ascender-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "smartcity-tracking-topic"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  
  # Kafka performance tuning
  KAFKA_FLUSH_INTERVAL: "100"    # Flush every N frames
  KAFKA_AUTO_FLUSH: "true"       # Enable automatic flushing
  
  # Schema Registry configuration
  USE_SCHEMA_REGISTRY: "true"
  SCHEMA_REGISTRY_URL: "http://schema-registry.kafka.svc.cluster.local:8081"
  AVRO_SCHEMA_SUBJECT: "smartcity-tracking-schema"

# Sensitive configuration - will be created as Kubernetes secrets
secrets:
  kafka:
    username: "smartcity"      # Replace with actual username
    password: "TYcrni8MfT6IkHriRp9W0VC844EvseJB"      # Replace with actual password
  schema_registry:
    username: ""  # Optional - set if Schema Registry requires auth
    password: ""  # Optional - set if Schema Registry requires auth
monitoring:
  enabled: true
  port: 15000
  prometheusUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  image:
    repository: oriolmac/monitoring-api
    tag: latest-arm
    pullPolicy: Always
  servicemonitor:
    releaseName: prometheus
  namespace: monitoring
  node:




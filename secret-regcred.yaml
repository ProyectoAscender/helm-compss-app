# Template for creating regcred secret
# Replace the placeholders with your actual GitHub credentials

# Method 1: Using kubectl command (recommended)
# Run this command in your terminal:
# kubectl create secret docker-registry regcred \
#   --docker-server=ghcr.io \
#   --docker-username=YOUR_GITHUB_USERNAME \
#   --docker-password=YOUR_GITHUB_TOKEN \
#   --docker-email=YOUR_EMAIL \
#   --namespace=smartcity

# Method 2: Using YAML file
# 1. First, generate the base64 encoded credentials:
#    echo -n "YOUR_GITHUB_USERNAME:YOUR_GITHUB_TOKEN" | base64
# 2. Then create the Docker config JSON and encode it:
#    echo -n '{"auths":{"ghcr.io":{"username":"YOUR_GITHUB_USERNAME","password":"YOUR_GITHUB_TOKEN","email":"YOUR_EMAIL","auth":"BASE64_FROM_STEP1"}}}' | base64
# 3. Replace the REPLACE_WITH_BASE64_DOCKERCONFIG below with the result from step 2

apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: lis-smartcity
type: kubernetes.io/dockerconfigjson
data:

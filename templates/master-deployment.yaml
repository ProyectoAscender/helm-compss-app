{{- $root := . -}}
{{- $vals := (toYaml .Values | fromYaml) -}}

{{- $workers := (dig "compss" "worker" "workers" (list) $vals) -}}
{{- $hetero := gt (len $workers) 0 -}}
{{- $n := ternary (len $workers) ((dig "compss" "worker" "number" 1 $vals) | int) $hetero -}}

{{- $defaultCpus := (dig "compss" "worker" "resources" "compssStartingCpus" "" $vals) | toString -}}
{{- $defaultMem  := (dig "compss" "worker" "resources" "compssStartingMemory" "" $vals) | toString -}}

{{- $cpusList := "" -}}
{{- $memList := "" -}}

{{- if $hetero -}}
  {{- $cpus := list -}}
  {{- $mems := list -}}
  {{- range $i, $w := $workers -}}
    {{- $c := (dig "resources" "compssStartingCpus" $defaultCpus $w) | toString -}}
    {{- $m := (dig "resources" "compssStartingMemory" $defaultMem $w) | toString -}}
    {{- $cpus = append $cpus $c -}}
    {{- $mems = append $mems $m -}}
  {{- end -}}
  {{- $cpusList = join "," $cpus -}}
  {{- $memList  = join "," $mems -}}

  {{- /* Validación: no permitir elementos vacíos en listas */ -}}
  {{- if or (eq $cpusList "") (contains ",," (printf ",%s," $cpusList)) -}}
    {{- fail "Invalid compssStartingCpus list. Define compss.worker.resources.compssStartingCpus or workers[].resources.compssStartingCpus for every worker." -}}
  {{- end -}}
  {{- if or (eq $memList "") (contains ",," (printf ",%s," $memList)) -}}
    {{- fail "Invalid compssStartingMemory list. Define compss.worker.resources.compssStartingMemory or workers[].resources.compssStartingMemory for every worker." -}}
  {{- end -}}
{{- else -}}
  {{- /* Homogéneo: exigir defaults */ -}}
  {{- if eq $defaultCpus "" -}}
    {{- fail "Missing compss.worker.resources.compssStartingCpus (homogeneous mode)" -}}
  {{- end -}}
  {{- if eq $defaultMem "" -}}
    {{- fail "Missing compss.worker.resources.compssStartingMemory (homogeneous mode)" -}}
  {{- end -}}
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-master
  labels:
    {{- include "compss-app.labels" . | nindent 4 }}
    app: compss 
    wf_id: {{ $.Release.Name }}
    role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compss 
      wf_id: {{ $.Release.Name }}
      role: master
  template:
    metadata:
      labels:
        app: compss 
        wf_id: {{ $.Release.Name }}
        role: master
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      initContainers:
      - name: wait-for-workers
        image: busybox
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 {{ $n }}); do
              worker_index=$((i - 1))
              until nslookup {{ .Release.Name }}-worker-${worker_index}.{{ .Release.Namespace }}.svc.cluster.local; do
                echo "Waiting for {{ .Release.Name }}-worker-${worker_index}";
                sleep 2;
              done;
            done
      containers:
      {{- if .Values.mqtt.enabled }}
      - name: mqtt
        image: "{{ .Values.mqtt.image.repository }}:{{ .Values.mqtt.image.tag }}"
        imagePullPolicy: {{ .Values.mqtt.image.pullPolicy }}
        ports:
          - name: mqtt
            containerPort: {{ .Values.mqtt.port }}
            protocol: TCP
        volumeMounts:
          - name: mosquitto-config
            mountPath: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
      {{- end }}
      {{- if .Values.monitoring.enabled }}
      - name: monitoring
        image: "{{ .Values.monitoring.image.repository }}:{{ .Values.monitoring.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.image.pullPolicy }}
        env:
          - name: PROMETHEUS_SERVER_URL
            value: {{ .Values.monitoring.prometheusUrl | quote }}
        ports:
        - name: monitoring
          containerPort: {{ .Values.monitoring.port }}
          protocol: TCP
    
      - name: redis-server
        image: "redis:latest"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["redis-server"]
        ports:
        - containerPort: {{ .Values.monitoring.redis.port }}
          name: redis
      {{- end }}
      - name: master
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env: 
        - name: DEPLOYMENT_NAME
          value: {{ .Release.Name }}
        - name: DEPLOYMENT_NAMESPACE
          value: {{ .Release.Namespace }}
        command: [ "/opt/COMPSs/Runtime/scripts/system/kubernetes/master.sh" ]
        args: 
          - "{{ .Release.Namespace }}"
          - "{{ $n }}"
          {{- if $hetero }}
          - "{{ $cpusList }}"
          - "{{ $memList }}"
          {{- else }}
          - "{{ $defaultCpus }}"
          - "{{ $defaultMem }}"
          {{- end }}
          - "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          - "{{ .Values.app.context.folderPath }}"  # app_dir
          - "{{ dig "compss" "cloud" "minVms" 0 $vals }}"
          - "{{ dig "compss" "cloud" "maxVms" 0 $vals }}"
          - "{{ dig "compss" "cloud" "creationTime" 0 $vals }}"
          - "43100" # master port
          {{- $schedparams := "" }}
          {{- range $key, $value := .Values.compss.master.scheduler_config }}
            {{- if ne $key "" }}  
              {{- $schedparams = printf "%s%s=%v;" $schedparams $key $value }}
            {{- end }}
          {{- end }}
          - "{{ $schedparams }}"
          {{- $params := "" }}
          {{- range $key, $value := .Values.app.params }}
            {{- if and (ne $key "") }}  
              {{- $params = printf "%s --%s %s" $params $key $value }}  
            {{- end }}
          {{- end }}
          - "--scheduler_config_file={{ .Values.app.context.folderPath }}/sched.config --scheduler=es.bsc.compss.scheduler.lookahead.locality.LocalityTS -d -t -g {{ .Values.app.context.folderPath }}/{{ .Values.app.context.file }}{{ $params }}"
        ports:
        - name: 43100-port
          containerPort: 43100 
      {{- if and .Values.compss.master.volume }}
        volumeMounts:
          - name: master-results-pvc
            mountPath: /root/.COMPSs/ # mount path within the container 
      volumes:
      - name: master-results-pvc
        persistentVolumeClaim:
          claimName: master-results-pvc
      {{- end }}
      {{- if .Values.mqtt.enabled }}
      volumes:
      - name: mosquitto-config
        configMap:
          name: {{ .Release.Name }}-mosquitto-config
      {{- end }}
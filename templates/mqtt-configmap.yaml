# templates/mqtt-configmap.yaml
{{- if .Values.mqtt.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mosquitto-config
  namespace: {{ .Release.Namespace }}
data:
  mosquitto.conf: |
    listener {{ .Values.mqtt.port }} 0.0.0.0
    allow_anonymous true
    # Producción: desactiva anonymous y usa password_file / TLS
{{- end }}

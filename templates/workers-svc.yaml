{{- $root := . -}}
{{- $vals := (toYaml .Values | fromYaml) -}}

{{- $workers := (dig "compss" "worker" "workers" (list) $vals) -}}
{{- $hasWorkers := gt (len $workers) 0 -}}
{{- $n := ternary (len $workers) ((dig "compss" "worker" "number" 1 $vals) | int) $hasWorkers -}}

{{- range $i := until $n }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $root.Release.Namespace }}
  name: {{ $root.Release.Name }}-worker-{{ $i }}
  labels:
    {{- include "compss-app.labels" $root | nindent 4 }}
spec:
  selector:
    app: compss
    wf_id: {{ $root.Release.Name }}
    role: worker-{{ $i }}
  ports:
  - name: port-22
    protocol: TCP
    port: 22
    targetPort: 22-port
  - name: port-43001
    protocol: TCP
    port: 43001
    targetPort: 43001-port
  - name: port-43002
    protocol: TCP
    port: 43002
    targetPort: 43002-port
  - name: port-49049
    protocol: TCP
    port: 49049
    targetPort: 49049-port
---
{{- end }}